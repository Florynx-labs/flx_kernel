[workspace]
resolver = "2"
members = [
    "kernel",
    "tools/runner",
    "tools/mm-tests",
    "tools/arch-smoke",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Florynx Labs <dev@florynx.org>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/florynx/flx-kernel"
homepage = "https://florynx.org"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
